# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 10
}

#order += "ipv6"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "memory"
order += "load"
order += "tztime local"

wireless _first_ {
        format_up = "📡%quality @ %essid %ip"
        format_down = "W:😓"
}

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        format_up = "E: %ip (%speed)"
        format_down = "E:😓"
}

battery all {
        format = "%status%remaining"
        status_chr = "⚡"
        status_bat = "🔋"
        status_unk = "?"
        status_full = "☻"
        hide_seconds = true
        # This is a trick when you have not the same sys directories
        # I executed this to fake %d and keep the behaviour on i3status:
        #  $> sudo ln -s /sys/class/power_supply/axp288_fuel_gauge/ /home/ebh/BAT1
        path = "/home/ebh/BAT%d/uevent"
}


tztime local {
        format = "⌚%Y.%m.%d %H:%M"
}

load {
        format = "🛸%5min"
}

disk "/" {
        format = "💽%free"
}
